  <circle cx="265" cy="420" r="10" fill="#9e7bff"/><circle cx="265" cy="413" r="4" fill="#101827"/><path d="M252 430c1-8 6-11 13-11s12 3 13 11" fill="#101827"/>
  <text x="283" y="419" fill="#b9a1ff" font-size="13" font-weight="750">Evidence-first</text><text x="283" y="436" fill="#9eb0c5" font-size="11">No invented achievements</text>
  <path d="M482 409l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#49b8ff"/>
  <text x="499" y="419" fill="#49b8ff" font-size="13" font-weight="750">Manual approval</text><text x="499" y="436" fill="#9eb0c5" font-size="11">You choose what to use</text>
  <path d="M688 430v-13h7v13m6 0v-21h7v21m6 0v-16h7v16" fill="none" stroke="#ff9347" stroke-width="3"/>
  <text x="722" y="419" fill="#ffad73" font-size="13" font-weight="750">Career-ready</text><text x="722" y="436" fill="#9eb0c5" font-size="11">Clear, grounded content</text>
</g>
