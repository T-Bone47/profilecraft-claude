  <circle cx="820" cy="195" r="8" fill="#1b8768"/><path d="M816 195l3 3 5-6" fill="none" stroke="#d4fff0" stroke-width="2"/><text x="840" y="200">Rewrite with verified evidence</text>
  <circle cx="820" cy="231" r="8" fill="#1b8768"/><path d="M816 231l3 3 5-6" fill="none" stroke="#d4fff0" stroke-width="2"/><text x="840" y="236">Tailor to a target job</text>
  <circle cx="820" cy="267" r="8" fill="#1b8768"/><path d="M816 267l3 3 5-6" fill="none" stroke="#d4fff0" stroke-width="2"/><text x="840" y="272">Validate length and unsupported claims</text>
</g>
<rect x="808" y="292" width="403" height="24" rx="7" fill="#172c3b"/><text x="824" y="308" fill="#6fe0b3" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">DRAFT  •  REVIEW  •  APPROVE  •  COPY</text>
