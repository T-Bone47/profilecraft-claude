<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="512" viewBox="0 0 1280 512" role="img" aria-labelledby="title desc">
<title id="title">ProfileCraft for Claude Code</title>
<desc id="desc">A dark navy and orange banner for a manual-first LinkedIn profile writing plugin with audit, optimization, job tailoring and project writing skills.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d16"/><stop offset=".6" stop-color="#0d1725"/><stop offset="1" stop-color="#111b2a"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb15e"/><stop offset="1" stop-color="#f36a27"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36b9ff"/><stop offset="1" stop-color="#2675e8"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#f8782e" stop-opacity=".22"/><stop offset="1" stop-color="#f8782e" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8fb5d7" stroke-opacity=".075" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="1280" height="512" rx="20" fill="url(#bg)"/>
<rect width="1280" height="512" rx="20" fill="url(#grid)"/>
<ellipse cx="1120" cy="220" rx="420" ry="320" fill="url(#glow)"/>
<path d="M0 455 C270 370 540 540 810 440 S1120 390 1280 450V512H0Z" fill="#f36a27" opacity=".045"/>
<!-- Brand -->
<rect x="42" y="43" width="76" height="76" rx="19" fill="url(#orange)"/>
<circle cx="72" cy="67" r="10" fill="#101827"/>
<path d="M55 98c1-13 8-20 17-20s16 7 17 20" fill="#101827"/>
<path d="M81 91l16-17 8 8-17 16-9 2z" fill="#101827"/>
<path d="M96 74l5-5 8 8-5 5" fill="#101827"/>
<text x="139" y="91" fill="#f7f9fc" font-family="Inter,Arial,sans-serif" font-size="57" font-weight="800" letter-spacing="-2">Profile<tspan fill="#ff9347">Craft</tspan></text>
<text x="143" y="122" fill="#a8bbd0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="6">FOR CLAUDE CODE</text>
<text x="42" y="174" fill="#f6f8fb" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="750" letter-spacing="-.6">Your experience. Your story. <tspan fill="#ff9347">Better presented.</tspan></text>
<text x="43" y="205" fill="#a8bbd0" font-family="Inter,Arial,sans-serif" font-size="16">Evidence-based LinkedIn profile writing, career positioning and project storytelling.</text>
