<g font-family="Inter,Arial,sans-serif">
  <text x="58" y="312" fill="#f4f7fb" font-size="16" font-weight="750">Profile Audit</text>
  <text x="58" y="338" fill="#a8bbd0" font-size="13">Find gaps and</text><text x="58" y="356" fill="#a8bbd0" font-size="13">prioritize fixes</text>
  <text x="236" y="312" fill="#f4f7fb" font-size="16" font-weight="750">Optimize</text>
  <text x="236" y="338" fill="#a8bbd0" font-size="13">Sharper headline,</text><text x="236" y="356" fill="#a8bbd0" font-size="13">About and bullets</text>
  <text x="414" y="312" fill="#f4f7fb" font-size="16" font-weight="750">Job Tailoring</text>
  <text x="414" y="338" fill="#a8bbd0" font-size="13">Match real evidence</text><text x="414" y="356" fill="#a8bbd0" font-size="13">to target roles</text>
  <text x="592" y="312" fill="#f4f7fb" font-size="16" font-weight="750">Project Writer</text>
  <text x="592" y="338" fill="#a8bbd0" font-size="13">Turn builds into</text><text x="592" y="356" fill="#a8bbd0" font-size="13">clear showcases</text>
</g>
<!-- Trust principles -->
<g font-family="Inter,Arial,sans-serif">
  <path d="M44 410l10 4v10l-10 8-10-8v-10z" fill="#52d6a0"/><path d="M39 420l4 4 7-8" fill="none" stroke="#062218" stroke-width="2.4"/>
