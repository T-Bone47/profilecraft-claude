name: Feature request
description: Propose an improvement to ProfileCraft
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what the skill or validator should do.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and scope
      options:
        - label: This request does not require LinkedIn login, scraping, automated profile changes, or security bypasses.
          required: true
