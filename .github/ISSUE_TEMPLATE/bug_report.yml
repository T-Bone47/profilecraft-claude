name: Bug report
description: Report a reproducible issue in ProfileCraft
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include private resumes, account identifiers, credentials or personal data. Use fictional examples."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: State the actual behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include minimal steps with fictional input only.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g. v22.0.0"
  - type: textarea
    id: checks
    attributes:
      label: Validation results
      description: Include the relevant test output, with secrets removed.
