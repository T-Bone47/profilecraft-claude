name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: node --check plugins/profilecraft/skills/linkedin-profile-optimizer/validate.mjs
      - name: Run tests
        run: npm test
      - name: Validate fictional example
        run: npm run validate:examples

  claude-plugin-validation:
    name: Claude Code marketplace and plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install official Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check CLI availability
        run: claude --version
      - name: Validate marketplace manifest and referenced plugin
        run: claude plugin validate . --strict
      - name: Validate plugin skills and manifest directly
        run: claude plugin validate ./plugins/profilecraft --strict
